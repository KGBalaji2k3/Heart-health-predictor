<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heart Disease Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h2 class="text-center text-primary mb-4">Heart Disease Prediction</h2>
            <form action="/predict" method="post">
                {% for feature in features %}
                    <div class="mb-3">
                        <label class="form-label"><b>{{ labels[feature] }}</b></label>
                        <input type="text" name="{{ feature }}" class="form-control" placeholder="Enter {{ labels[feature] }}" required>
                    </div>
                {% endfor %}
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Predict</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
